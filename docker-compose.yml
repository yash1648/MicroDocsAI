version: '3.9'

services:
  # Main MicroDocs AI Application
  microdocs-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: microdocs-orchestrator
    image: microdocs-ai:latest
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LOG_LEVEL=INFO
      - PROJECT_PATH=/app/sample_project
      - PYTHONUNBUFFERED=1
    ports:
      - "8080:8080"
    volumes:
      - ./sample_project:/app/sample_project:ro
      - ./documentation_output:/app/output
      - ./logs:/app/logs
      - microdocs-cache:/app/cache
    networks:
      - microdocs-network
    restart: unless-stopped
    command: python3 main.py
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.microdocs.component=orchestrator"
      - "com.microdocs.version=1.0.0"

  # RAG System Container
  microdocs-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: microdocs-rag
    image: microdocs-ai:latest
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    volumes:
      - ./sample_project:/app/sample_project:ro
      - ./query_history:/app/query_history
      - ./logs:/app/logs
      - microdocs-cache:/app/cache
    networks:
      - microdocs-network
    restart: unless-stopped
    command: python3 rag_system.py
    depends_on:
      microdocs-orchestrator:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.microdocs.component=rag"

  # Evaluation Container
  microdocs-evaluator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: microdocs-evaluator
    image: microdocs-ai:latest
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    volumes:
      - ./documentation_output:/app/documentation_output:ro
      - ./evaluation_reports:/app/evaluation_reports
      - ./logs:/app/logs
      - microdocs-cache:/app/cache
    networks:
      - microdocs-network
    restart: unless-stopped
    command: python3 evaluation.py
    depends_on:
      microdocs-orchestrator:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.microdocs.component=evaluator"

  # Optional: MySQL Database (for future persistence)
  mysql:
    image: mysql:8.0
    container_name: microdocs-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-microdocs_root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-microdocs_db}
      - MYSQL_USER=${MYSQL_USER:-microdocs}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-microdocs_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - microdocs-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - with-db

  # Optional: Redis for Caching
  redis:
    image: redis:7-alpine
    container_name: microdocs-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-microdocs_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - microdocs-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - with-cache

networks:
  microdocs-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  microdocs-cache:
    driver: local
  mysql-data:
    driver: local
  redis-data:
    driver: local